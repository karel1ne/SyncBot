[project]
name = "syncbot"
version = "0.1.0"
description = "Telegram message mirroring bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "tgcrypto>=1.2.5",
    "loguru>=0.7.2",
    "pydantic-settings[yaml]>=2.13.1",
    "kurigram>=2.2.19",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
]

[project.scripts]
syncbot = "syncbot.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pyrogram.sync",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.6",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] # Basic errors, Pyflakes, isort, pyupgrade
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disable_error_code = ["no-untyped-def", "no-untyped-call", "union-attr", "arg-type", "var-annotated"]
